<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description"
    content="Generate custom Spot It / Dobble game cards, export them to PDF, and play solo or with two players.">
  <title>Dobble Mint · Spot It Card Generator</title>
  <script>
    // Apply saved color scheme before first paint to avoid a flash
    document.documentElement.dataset.theme = localStorage.getItem('dm-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  </script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/play.css">
</head>

<body>
  <!-- ===== DESIGNER VIEW ===== -->
  <div class="app" id="designer-view">
    <!-- ===== TOP BAR ===== -->
    <header class="topbar">
      <a class="brand" href="./" id="brand-link" title="Back to top">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5"
            fill="none" stroke="currentColor" stroke-width="2" /><circle cx="10" cy="10" r="4.5"
            fill="currentColor" /></svg>
        <span class="brand-name">Dobble Mint</span>
      </a>

      <div class="topbar-deck">
        <label class="visually-hidden" for="order-select">Deck size</label>
        <select id="order-select" title="Projective plane order"></select>

        <label class="visually-hidden" for="theme-select">Symbol theme</label>
        <select id="theme-select"></select>

        <button class="btn btn-icon" id="shuffle-btn" title="Shuffle deck" aria-label="Shuffle deck">⟳</button>
      </div>

      <div class="topbar-actions">
        <button class="btn btn-ghost" id="copy-link-btn" title="Copy a link to this exact deck">Copy link</button>
        <button class="btn btn-ghost" id="match-btn" aria-pressed="false"
          title="Click two cards to reveal their shared symbol">Find the match</button>
        <button class="btn btn-icon" id="color-scheme-btn" title="Toggle dark mode"
          aria-label="Toggle dark mode">☾</button>
        <button class="btn btn-ghost" id="play-btn" title="Play a game with this deck">Play ▶</button>
        <button class="btn btn-primary" id="generate-pdf-btn">Export PDF</button>
      </div>
    </header>

    <!-- ===== SETTINGS ===== -->
    <aside class="panel" id="panel">
      <section class="panel-section">
        <h2 class="panel-title">Shape</h2>
        <div class="segmented segmented-icons">
          <input type="radio" name="shape" id="shape-circle" value="circle" checked>
          <label for="shape-circle" title="Circle"><svg class="shape-icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/></svg><span
              class="visually-hidden">Circle</span></label>

          <input type="radio" name="shape" id="shape-square" value="square">
          <label for="shape-square" title="Square"><svg class="shape-icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="2"/></svg><span
              class="visually-hidden">Square</span></label>

          <input type="radio" name="shape" id="shape-hexagon" value="hexagon">
          <label for="shape-hexagon" title="Hexagon"><svg class="shape-icon" viewBox="0 0 16 16" aria-hidden="true"><polygon points="8,1.5 13.6,4.75 13.6,11.25 8,14.5 2.4,11.25 2.4,4.75"/></svg><span
              class="visually-hidden">Hexagon</span></label>

          <input type="radio" name="shape" id="shape-octagon" value="octagon">
          <label for="shape-octagon" title="Octagon"><svg class="shape-icon" viewBox="0 0 16 16" aria-hidden="true"><polygon points="5.3,1.5 10.7,1.5 14.5,5.3 14.5,10.7 10.7,14.5 5.3,14.5 1.5,10.7 1.5,5.3"/></svg><span
              class="visually-hidden">Octagon</span></label>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="panel-title">Layout</h2>
        <div class="segmented">
          <input type="radio" name="layout" id="layout-ring" value="ring" checked>
          <label for="layout-ring">Ring</label>

          <input type="radio" name="layout" id="layout-grid" value="grid">
          <label for="layout-grid">Grid</label>

          <input type="radio" name="layout" id="layout-random" value="random">
          <label for="layout-random">Scatter</label>
        </div>
      </section>

      <section class="panel-section">
        <h2 class="panel-title">Variation</h2>
        <div class="slider-row">
          <label for="size-variance">Size</label>
          <input type="range" id="size-variance" min="0" max="25" step="1" value="0">
          <output id="size-variance-val" for="size-variance">Off</output>
        </div>
        <div class="slider-row">
          <label for="max-angle">Spin</label>
          <input type="range" id="max-angle" min="0" max="180" step="10" value="0">
          <output id="max-angle-val" for="max-angle">Off</output>
        </div>
        <div class="field-row">
          <label for="seed-input">Seed</label>
          <input type="number" id="seed-input" min="0" max="99999" step="1">
        </div>
      </section>

      <section class="panel-section">
        <h2 class="panel-title">Print</h2>
        <div class="field-row">
          <label for="page-size">Page</label>
          <select id="page-size">
            <option value="a4">A4</option>
            <option value="letter" selected>US Letter</option>
          </select>
        </div>
        <div class="field-row">
          <label for="cards-per-row">Per row</label>
          <select id="cards-per-row">
            <option value="2">2</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
          </select>
        </div>
        <div class="field-row">
          <label for="bleed-marks">Bleed marks</label>
          <label class="switch">
            <input type="checkbox" id="bleed-marks" checked>
            <span class="switch-track"></span>
          </label>
        </div>
      </section>
    </aside>

    <!-- ===== DECK ===== -->
    <main class="main">
      <div id="error-msg" class="error-msg hidden" role="alert"></div>
      <p id="match-hint" class="match-hint hidden" aria-live="polite"></p>
      <div id="card-grid"></div>
    </main>
  </div>

  <!-- ===== PLAY VIEW ===== -->
  <div id="play-view" class="play-view hidden">
    <!-- ===== START ===== -->
    <section id="start-screen" class="start">
      <header class="start-header">
        <a class="brand" href="./" id="play-brand-link" title="Back to the designer">
          <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8.5"
              fill="none" stroke="currentColor" stroke-width="2" /><circle cx="10" cy="10" r="4.5"
              fill="currentColor" /></svg>
          <span class="brand-name">Dobble Mint</span>
        </a>
      </header>

      <section class="start-panel">
        <h1 class="start-title">The Tower</h1>
        <p class="start-rules">Tap the symbol your card shares with the center card to win it.
          Keep going until the pile is gone.</p>

        <div class="segmented" id="mode-picker">
          <input type="radio" name="mode" id="mode-solo" value="solo" checked>
          <label for="mode-solo">Solo</label>
          <input type="radio" name="mode" id="mode-duel" value="duel">
          <label for="mode-duel">2 Players</label>
        </div>
        <p class="start-note" id="mode-note"></p>

        <div class="field-row">
          <label for="play-order">Deck</label>
          <select id="play-order"></select>
        </div>

        <p class="start-best" id="best-time" aria-live="polite"></p>

        <button class="btn btn-primary btn-large" id="start-btn">Start</button>
        <a class="start-edit" id="edit-link" href="./">Edit this deck</a>
        <p id="play-error" class="error-msg hidden" role="alert"></p>
      </section>
    </section>

    <!-- ===== BOARD ===== -->
    <section id="board" class="board hidden" data-mode="solo" aria-label="Game board">
      <div class="seat seat-top" data-seat="1">
        <div class="seat-hud"><span class="seat-score" id="score-1">0</span> cards</div>
        <div class="slot" data-slot="p1"></div>
      </div>

      <div class="center-row">
        <div class="hud" id="solo-hud">
          <span class="hud-timer" id="timer">0:00.0</span>
          <span class="hud-penalty" id="penalty-toast" aria-live="polite"></span>
        </div>
        <div class="slot slot-center" data-slot="center"></div>
        <div class="center-meta">
          <span class="pile-count"><span id="cards-left">0</span> left</span>
          <button class="btn btn-icon" id="quit-btn" title="Quit game" aria-label="Quit game">✕</button>
        </div>
      </div>

      <div class="seat seat-bottom" data-seat="0">
        <div class="slot" data-slot="p0"></div>
        <div class="seat-hud"><span class="seat-score" id="score-0">0</span> cards</div>
      </div>
    </section>

    <!-- ===== RESULTS ===== -->
    <section id="results" class="results hidden" aria-live="polite">
      <div class="result-card result-top" id="result-1"></div>
      <div class="result-actions">
        <button class="btn btn-primary" id="again-btn">Play again</button>
        <button class="btn btn-ghost" id="menu-btn">Menu</button>
      </div>
      <div class="result-card" id="result-0"></div>
    </section>
  </div>

  <!-- Libraries (CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"
    integrity="sha512-plOdviVmws4Y3JAvbnpfKb2hVxKM1lCwsi3vmElYRj+tiDLffZ4FVUj5a8vyKJ9pIgl8JCAHEJ4D1iUKBecswg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <!-- App modules -->
  <script src="js/math.js"></script>
  <script src="js/symbols.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/deck.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/game.js"></script>
  <script src="js/play.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
